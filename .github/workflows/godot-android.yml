name: NitroRacing Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Android export requirements
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip curl
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt" || (echo "Android Build Tools 34.0.0 did not install correctly"; ls -la "$ANDROID_HOME/build-tools"; exit 1)
          echo "=== Android SDK build-tools diagnostic ==="
          ls -la "$ANDROID_HOME/build-tools"
          for v in 34.0.0; do
            echo "--- build-tools $v ---"
            ls -l "$ANDROID_HOME/build-tools/$v/apksigner" "$ANDROID_HOME/build-tools/$v/aapt" 2>&1 || true
            "$ANDROID_HOME/build-tools/$v/apksigner" --version 2>&1 || true
          done
          test -f "$ANDROID_HOME/platforms/android-34/android.jar" || (echo "Android platform 34 missing"; exit 1)

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Download free CC0 supercar model
        run: |
          mkdir -p godot/assets/cars
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/JaronKBragg7337/spectral-gt-rs/main/spectral_gt_rs_game_ready.glb" \
            -o godot/assets/cars/player_supercar.glb
          test "$(stat -c%s godot/assets/cars/player_supercar.glb)" -gt 3000000

      - name: Download free CC0 asphalt PBR textures from Poly Haven
        run: |
          mkdir -p godot/assets/textures
          curl -L --fail --retry 3 -H "User-Agent: NitroRacing-Android/1.0" \
            "https://api.polyhaven.com/files/asphalt_track" -o /tmp/asphalt_files.json
          python3 - <<'PY'
          import json, subprocess, sys
          data = json.load(open("/tmp/asphalt_files.json"))
          def find_map(node, names):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key.lower() in names:
                          def find_jpg(x):
                              if isinstance(x, dict):
                                  for fmt in ("jpg", "png"):
                                      if fmt in x and isinstance(x[fmt], dict) and x[fmt].get("url"):
                                          return x[fmt]["url"]
                                  for v in x.values():
                                      found = find_jpg(v)
                                      if found: return found
                              return None
                          url = find_jpg(value)
                          if url: return url
                  for value in node.values():
                      found = find_map(value, names)
                      if found: return found
              return None
          maps = {
              "road_albedo.jpg": {"diff", "diffuse", "albedo", "color"},
              "road_normal.jpg": {"nor_gl", "normal_gl", "normal"},
              "road_roughness.jpg": {"rough", "roughness"},
          }
          for filename, keys in maps.items():
              url = find_map(data, keys)
              if not url:
                  print("Missing Poly Haven texture map:", filename, file=sys.stderr)
                  sys.exit(1)
              subprocess.run(["curl", "-L", "--fail", "--retry", "3", url,
                              "-o", "godot/assets/textures/" + filename], check=True)
              print("Downloaded", filename)
          PY
          test "$(stat -c%s godot/assets/textures/road_albedo.jpg)" -gt 10000
          test "$(stat -c%s godot/assets/textures/road_normal.jpg)" -gt 10000
          test "$(stat -c%s godot/assets/textures/road_roughness.jpg)" -gt 10000

      - name: Validate Godot project
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          set -o pipefail
          godot --headless --editor --path godot --quit 2>&1 | tee /tmp/godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-validation.log; then
            echo "Godot script validation failed; refusing to export a broken APK."
            exit 1
          fi

      - name: Export Android APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          mkdir -p godot/build
          godot --headless --verbose --path godot --export-debug "Android" build/NitroRacing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroRacing-Android-APK
          path: godot/build/NitroRacing.apk
          if-no-files-found: error
