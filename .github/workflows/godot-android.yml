name: NitroRacing Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Godot project
        run: |
          godot --headless --editor --path godot --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Android" build/NitroRacing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroRacing-Android-APK
          path: build/NitroRacing.apk
          if-no-files-found: error
